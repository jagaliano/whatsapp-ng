---
name: Release candidate

'on':
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize all versions; never cancel an in-flight publication.
concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'jagaliano/whatsapp-ng'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.candidate.outputs.artifact-id }}
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Pin npm
        run: >-
          npm install --global npm@11.20.0
          --ignore-scripts --no-audit --no-fund
      - name: Check exact release tag and main ancestry
        run: npm run release:check-tag
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Validate and prepare only
        run: npm run release:prepare
        env:
          PI_OFFLINE: '1'
      - name: Retain exact candidate and receipt
        id: candidate
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-candidate-${{ github.sha }}
          path: |
            .pi/cache/releases/prepared.json
            .pi/cache/releases/*/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: prepare
    # Default off. Configure the protected environment and npm trust FIRST.
    if: >-
      github.repository == 'jagaliano/whatsapp-ng' &&
      vars.NPM_PUBLISH_ENABLED == 'true' &&
      github.run_attempt == 1
    environment: npm-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Pin npm
        run: >-
          npm install --global npm@11.20.0
          --ignore-scripts --no-audit --no-fund
      - name: Download only this run's prepared candidate
        # actions/download-artifact v8.0.2
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact-id }}
          merge-multiple: true
          path: .pi/cache/releases
      # No dependency install, npm token, whoami gate or repacking here.
      - name: Publish exact candidate with OIDC and verify registry
        run: npm run release:publish-ci
        env:
          NPM_PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
      - name: Retain publication attempt evidence even on failure
        if: always()
        # actions/upload-artifact v7.0.2
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: npm-attempt-${{ github.run_id }}-${{ github.run_attempt }}
          path: .pi/cache/releases/publish-*.attempt.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
