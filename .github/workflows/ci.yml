---
name: CI

'on':
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26.12.1'
          package-manager-cache: false
      - name: Pin npm
        run: >-
          npm install --global npm@11.20.0
          --ignore-scripts --no-audit --no-fund
      - name: Install native test tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg tesseract-ocr \
            tesseract-ocr-eng tesseract-ocr-spa
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --legacy-peer-deps --no-audit --no-fund
      - name: Validate and prepare only (never publish)
        run: npm run release:prepare
        env:
          PI_OFFLINE: '1'
