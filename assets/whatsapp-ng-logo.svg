<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="whatsapp-ng logo" xmlns:c2pa="http://c2pa.org/manifest">
  <title>whatsapp-ng</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14261c"/>
      <stop offset="1" stop-color="#08110c"/>
    </linearGradient>
    <linearGradient id="bubble" gradientUnits="userSpaceOnUse" x1="120" y1="96" x2="400" y2="420">
      <stop offset="0" stop-color="#3be07f"/>
      <stop offset="1" stop-color="#0f9d7a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#25d366" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#25d366" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- speech bubble with tail -->
  <circle cx="256" cy="246" r="150" fill="url(#bubble)"/>
  <polygon points="122,308 94,426 214,378" fill="url(#bubble)" stroke="url(#bubble)" stroke-width="14" stroke-linejoin="round"/>

  <!-- pi symbol -->
  <g fill="none" stroke="#08110c" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path d="M178 216 Q184 202 204 202 H336"/>
    <path d="M226 204 Q222 250 216 296"/>
    <path d="M292 204 V266 Q292 296 324 296"/>
  </g>

  <!-- "next-gen" sparkle -->
  <path d="M414 76 Q417 98 440 102 Q417 106 414 128 Q411 106 388 102 Q411 98 414 76Z" fill="#a8ffcf"/>
  <circle cx="452" cy="146" r="6" fill="#a8ffcf" opacity="0.7"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
